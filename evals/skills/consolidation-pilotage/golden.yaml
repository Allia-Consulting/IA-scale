skill: consolidation-pilotage
version_harnais: 1
cas:
  - id: nominal-01
    type: invariant
    description: "Cas nominal — grille prévue 2 ressources × 3 mois + 2 factures : transformation matriciel → long, une ligne par cellule renseignée, mois au 1er du mois."
    contient:
      - "matriciel → long"
      - "(Ressource, Mois) dont la valeur > 0"
      - "1er du mois"
  - id: fusion-02
    type: invariant
    description: "Régénération réconciliée — montant d'une facture existante modifié : le gabarit est régénéré (jamais réécrit en place), sans suppression ; clé d'appariement T_Echeancier (CodeMission, EtiquetteLocale) — stable avant/après émission (v1.5, T-0030)."
    contient:
      - "RÉGÉNÉRATION RÉCONCILIÉE, JAMAIS DE SUPPRESSION"
      - "(CodeMission, EtiquetteLocale)"
  - id: garde-03
    type: invariant
    description: "Garde — un mois existant repassé à 0 : aucune écriture qui efface, la ligne est reportée dans le jeu régénéré + anomalie attendue."
    contient:
      - "n'efface RIEN au gabarit"
      - "correction de suppression à confirmer par le responsable"
  - id: archivage-04
    type: invariant
    description: "Archivage = DÉPLACEMENT (T-0035 reprise n°4) : workbook_archiver_gabarit déplace le gabarit courant vers 00 - Old (synchrone), ce qui LIBÈRE le nom pour la ré-instanciation fail-closed."
    contient:
      - "workbook_archiver_gabarit"
      - "DÉPLACE"
      - "Le déplacement est SYNCHRONE"
  - id: cran-05
    type: invariant
    description: "Cran — reconcilier_gabarit_pilotage = auto, réversible par archivage par DÉPLACEMENT (nom libéré, version conservée dans 00 - Old) + régénération sans suppression."
    contient:
      - "reconcilier_gabarit_pilotage"
      - "archivage par DÉPLACEMENT"
  - id: reconciliation-10
    type: invariant
    description: "Régénération d'un gabarit EXISTANT rendue machine : réconcilier en mémoire → archiver (déplacement, nom libéré) → ré-instancier (preuve froide) → repeupler ; idempotent, réversible (00 - Old), journalisé."
    contient:
      - "archiver (DÉPLACEMENT, nom libéré)"
      - "ré-instancier"
      - "preuve FROIDE §8"
  - id: bornage-06
    type: invariant
    description: "Garde-fou structurel — écriture bornée par construction : le skill ne manipule jamais de drive_id/item_id en écriture."
    contient:
      - "ne manipule jamais de `drive_id`/`item_id` en écriture"
  - id: statut-validation-07
    type: invariant
    description: "Garde-fou — jamais de rétrogradation d'un StatutValidation validé vers à valider sans changement de jours."
    contient:
      - "Ne JAMAIS rétrograder un `StatutValidation` « validé » vers « à valider »"
  - id: anomalies-08
    type: invariant
    description: "Anomalies signalées jamais résolues seul — convention d'identifiant ressource (mail Allia / mail du sous-traitant)."
    contient:
      - "mail Allia"
      - "mail du sous-traitant"
  - id: instanciation-09
    type: invariant
    description: "Instanciation — saisie d'une mission SANS gabarit : l'agent instancie (workbook_instancier_gabarit), sans archivage préalable, puis écrit nominalement."
    contient:
      - "l'agent l'INSTANCIE, puis poursuit la consolidation"
      - "workbook_instancier_gabarit"
      - "ne subit PAS d'archivage préalable"
  - id: allocation-emise-avec-etiquette-11
    type: invariant
    description: "Allocation (T-0030) — ligne émise AVEC EtiquetteLocale et sans NumFacture : appel gouverné allouer_num_facture, numéro rendu posé dans le jeu régénéré puis écrit dans T_Echeancier.NumFacture au repeuplement."
    contient:
      - "allouer_num_facture(code_mission, etiquette_locale, mois_ca, montant_ht, echeance)"
      - "posé dans le jeu régénéré"
      - "écrit dans `T_Echeancier.NumFacture`"
  - id: allocation-emise-sans-etiquette-12
    type: invariant
    description: "Allocation (T-0030) — ligne émise SANS EtiquetteLocale : anomalie, aucun appel d'allocation, jamais de numéro forgé localement."
    contient:
      - "Ligne émise SANS `EtiquetteLocale` dans la saisie"
      - "ne jamais forger un numéro localement"
  - id: allocation-idempotence-13
    type: invariant
    description: "Allocation (T-0030) — re-dérivation : l'outil est idempotent par clé (CodeMission, EtiquetteLocale) ; il rend le numéro existant sans écrire (pas de double allocation)."
    contient:
      - "IDEMPOTENT par clé `(CodeMission, EtiquetteLocale)`"
      - "rend le numéro existant sans écrire"
  - id: allocation-report-existant-14
    type: invariant
    description: "Allocation (T-0030) — NumFacture déjà présent au gabarit : reporté tel quel comme champ propre au gabarit, jamais de réallocation ni d'appel."
    contient:
      - "REPORTER tel quel"
      - "jamais de réallocation, aucun appel"
  - id: allocation-cran-15
    type: invariant
    description: "Allocation (T-0030) — cran de allouer_num_facture = validé (séquence légale irréversible + la facture sort de la firme) ; porte tenue par le déclenchement manuel, aucune orchestration."
    contient:
      - "Allouer le `NumFacture` d'une ligne émise (`allouer_num_facture`)"
      - "séquence légale irréversible"
  # --- v1.6 (T-0045) — dérivation du Réalisé par POSITION, lecture bornée des saisies -----------
  # Cause racine mesurée le 01/08/2026 : le §2 faisait lire la saisie par le connecteur M365
  # (surface humaine) qui APLATIT la grille — c'est LÀ que les 22 j de juillet se perdaient, ni
  # dans Graph ni dans les droits. Ces ancres verrouillent la correction, cas par cas.
  - id: lecture-bornee-saisie-16
    type: invariant
    description: "v1.6 — la saisie se lit par la primitive BORNÉE lire_saisie_table (image 0.22.0), plus par le connecteur M365 : le connecteur aplatit la grille et détruit les positions."
    contient:
      - "`lire_saisie_table(code_mission, table)`"
      - "le connecteur M365 **aplatit** la grille"
      - "lignes POSITIONNELLES"
  - id: tables-saisie-17
    type: invariant
    description: "v1.6 — noms RÉELS mesurés : onglets sans accents et TROIS tables nommées SAISIE_* ; piège consigné, T_Imputations est la table du GABARIT, jamais de la saisie."
    contient:
      - "`SAISIE_Realise_<millésime>`"
      - "`T_Imputations` est la table du **GABARIT**"
  - id: derivation-position-18
    type: invariant
    description: "v1.6 (§5.6 v1.28) — la dérivation lit PAR POSITION : l'index de colonne porte le mois, jamais un en-tête relu ni une inférence."
    contient:
      - "l'**INDEX de colonne porte le mois**"
      - "jamais un en-tête relu, jamais une inférence"
  - id: vides-non-resserres-19
    type: invariant
    description: "v1.6 — une cellule vide est un mois sans imputation : elle n'est ni comptée ni resserrée. C'est le resserrement qui décale (mécanique exacte de l'écart 3g)."
    contient:
      - "une cellule VIDE est un mois SANS imputation"
      - "ni comptée, ni « resserrée »"
      - "c'est le resserrement qui DÉCALE"
  - id: lignes-ecartees-20
    type: invariant
    description: "v1.6 — lignes écartées de la dérivation : l'en-tête technique « Nb. jours ouvres max » (pas une ressource) et les lignes fantômes de la zone pré-dimensionnée (TOTAL == 0)."
    contient:
      - "« Nb. jours ouvres max »"
      - "dont le `TOTAL` vaut **0**"
      - "lignes fantômes"
  - id: controle-somme-21
    type: invariant
    description: "v1.6 — CONTRÔLE OBLIGATOIRE avant toute écriture : Σ des douze positions == TOTAL sur chaque ligne retenue ; sinon anomalie et zéro écriture pour la mission."
    contient:
      - "**Σ des douze positions == colonne `TOTAL`**"
      - "zéro écriture pour cette mission"
  - id: jamais-mois-forge-22
    type: invariant
    description: "v1.6 — fail-closed honnête : jamais de mois forgé ni déduit par recoupement quand l'égalité ne tombe pas (c'est ce qui a tenu à l'épreuve 3g, à conserver)."
    contient:
      - "JAMAIS de mois forgé ni déduit par recoupement"
  - id: controle-miroir-mission-23
    type: invariant
    description: "v1.6 — contrôle miroir au niveau mission : Σ JoursRealises dérivés == Σ des TOTAL des lignes retenues (une ligne juste ne garantit pas un total juste)."
    contient:
      - "Σ `JoursRealises` dérivés == Σ des `TOTAL` des lignes retenues"
  - id: anomalie-table-saisie-absente-24
    type: invariant
    description: "v1.6 — anomalie : table de saisie absente ou renommée (millésime nouveau, onglet renommé) → signalée, aucune dérivation muette de la mission."
    contient:
      - "Table de saisie ABSENTE ou RENOMMÉE"
  - id: anomalie-ressource-hors-referentiel-25
    type: invariant
    description: "v1.6 — anomalie : ressource présente en saisie mais absente de T_Ressources → signalée, JAMAIS créée par l'agent (le référentiel est une source, pas un dérivé)."
    contient:
      - "présente en saisie mais ABSENTE de `T_Ressources`"
      - "signalée, jamais créée"
  - id: mesure-3g-26
    type: invariant
    description: "v1.6 — note d'usage datée : l'écart de 22 j de l'épreuve 3g s'expliquait par la lecture APLATIE ; mesure du 01/08 sur la mission 1 (Réalisé 61 = TOTAL, Prévu 148 = TOTAL)."
    contient:
      - "les 22 j de juillet se perdaient dans la LECTURE APLATIE"
      - "Mai 17 + Juin 22 + Juillet 22 = 61 = TOTAL"
