note: >
  Né de la vague de conception du 03/08/2026, gravé par tour-de-controle.md v2.3 §3.5 (mergée).
  Ce chantier exécute l'ABROGATION CONSCIENTE ET BORNÉE du principe v2.1 « aucune création de
  facture depuis le cockpit ». L'abrogation vaut pour la SEULE cascade d'émission : tout le reste de
  l'économique demeure en lecture seule et s'édite dans la saisie (v2.3 §1). Si l'implémentation
  devait élargir cette brèche d'un seul geste, elle sortirait du contrat et exigerait un nouveau
  passage par la boucle de promotion.
  À TRANCHER PAR L'ARCHITECTE À L'OUVERTURE DU CHANTIER, et à consigner ici avant la première ligne
  de code — DOMICILE DE L'ÉCRITURE « ÉMISE ». Deux voies, nommées à modele-donnees v1.30 §5.6 :
  (a) écriture dans la SAISIE sous identité DÉLÉGUÉE du cliqueur — patron de l'écran de déclaration
  de temps nommé en T-0046 ; la saisie reste la source, l'agent la re-dérive ensuite ;
  (b) vérité BASCULÉE au registre « Factures », re-dérivée vers l'échéancier — le registre étant
  déjà la source de vérité du NumFacture (modele-donnees §2 bis).
  Le choix n'est pas cosmétique : il décide OÙ VIT LA VÉRITÉ du statut d'émission, donc qui la
  re-dérive et dans quel sens. Ce qui NE SE NÉGOCIE PAS, quelle que soit la voie retenue :
  L'INVARIANT « LA MACHINE N'ÉCRIT JAMAIS LA SAISIE ». En voie (a), l'écriture est celle de
  l'UTILISATEUR sous son identité déléguée — ce n'est pas la machine qui écrit, et le droit
  (Sites.Selected role=read de l'identité managée) le garantit avant le code : ne JAMAIS ajouter de
  scope Files.* pour faire tenir cette voie.
  MATIÈRE DISPONIBLE POUR LE MODÈLE : les trois PDF Siteflow F-2026-001..003 sont le seed documenté
  de la numérotation (modele-donnees §2 bis, arbitrage du 28/07) ; prochain numéro alloué =
  F-2026-004.
  ÉTAT DU RÉEL AU NOMMAGE (04/08/2026) : allouer_num_facture est au canon (table-des-crans, cran
  validé) et outillé côté serveur, mais n'a JAMAIS ÉTÉ SOLLICITÉ sur le réel — l'épreuve T-0046 du
  01/08 s'est déroulée intégralement en crans auto, aucune ligne n'étant au statut « émise ». Cette
  épreuve sera donc le PREMIER exercice réel du cran validé de la chaîne de facturation.

  SUR LE CRAN — bloc AJOUTÉ le 05/08/2026 ; rien de ce qui précède n'est réécrit. Le champ cran
  ci-dessus porte désormais la valeur du vocabulaire contrôlé (auto | notifie | valide |
  anonymisation) : valide, LA PLUS STRICTE des valeurs que portait la prose. Trois motifs
  CONVERGENTS, aucun ne pouvant être abaissé par les autres : (1) la cascade appelle
  allouer_num_facture, dont le cran est VALIDÉ au canon (table-des-crans.yaml v1.17) — la
  confirmation du gardien AU CLIC EST la porte humaine de ce cran, elle ne la contourne pas, et les
  préconditions fail-closed du serveur demeurent la dernière garde ; (2) la facture SORT DE LA FIRME
  et l'allocation grave une SÉQUENCE LÉGALE IRRÉVERSIBLE ; (3) « promouvoir une évolution du
  cockpit » est déjà un cran validé à lui seul (tour-de-controle.md §6), rayon firme entière. Ce qui
  n'est PAS le cran du chantier : les écritures humaines de la cascade (statut « émise » sous
  l'identité du cliqueur, génération et upload du Word sous identité utilisateur) sont HORS du
  régime des crans (§6) ; l'édition du code en branche est un cran auto ; la porte de merge du
  chemin sensible est un mécanisme de la CI. Le régime de CASCADE DÉTERMINISTE (§1 régime 2 —
  annonce préalable exhaustive + confirmation explicite obligatoires) reste une EXIGENCE ENTIÈRE du
  chantier : il n'est pas une valeur du vocabulaire des crans, il ne se substitue pas à la porte
  humaine, il la matérialise à l'écran.
  Prose antérieure du champ, reportée ici sans perte : « CASCADE DÉTERMINISTE (tour-de-controle.md
  §1 régime 2) : annonce préalable EXHAUSTIVE des écritures + confirmation explicite obligatoires.
  L'appel à allouer_num_facture porte le cran VALIDÉ — la confirmation du gardien AU CLIC EST la
  porte humaine (table-des-crans.yaml v1.17, note d'exécution) ; les préconditions fail-closed du
  serveur sont INCHANGÉES et demeurent la dernière garde. Les écritures humaines de la cascade
  (statut « émise » sous identité du cliqueur, génération/upload du Word sous identité utilisateur)
  sont HORS crans (§6). PR sur chemin sensible -> porte humaine ».

  DOMICILE TRANCHÉ — bloc AJOUTÉ le 06/08/2026 (S50), par arbitrage gardien ; il SOLDE la
  question « à trancher par l'architecte » posée plus haut, sans la réécrire. La règle du
  gardien : « le fichier Excel déposé présente la facturation qui fait foi ; ensuite le
  comptable fait l'acte de comptabilité ». Conséquence : NI la voie (a) NI la voie (b) telles
  que posées — la SAISIE fait foi, et le registre « Factures » porte le NUMÉRO, jamais la
  vérité de ce qui est dû. La cascade « Éditer = émettre » ne crée donc AUCUNE seconde vérité :
  elle alloue le numéro, génère le Word, le dépose, renseigne LienFacture. Le statut « émise »
  de l'onglet Facturation reste une SAISIE HUMAINE dans le classeur, au rythme du responsable —
  le cockpit ne l'écrit pas, la machine encore moins (modele-donnees v1.33 §2 bis (g)).

  L'AFFIRMATION « allouer_num_facture n'a JAMAIS ÉTÉ SOLLICITÉ sur le réel » CI-DESSUS EST
  DÉMENTIE, et l'était à sa rédaction : le registre porte F-2026-0004 (2026-07-datalab,
  15 400 €), créée le 31/07/2026 à 16:55:13 par « Application SharePoint » — la seule écriture
  MACHINE du registre ; les six autres lignes portent l'identité déléguée du gardien. Corrigé
  par renvoi d'ici, non réécrit plus haut. L'épreuve reste néanmoins le PREMIER exercice réel du
  cran validé DEPUIS LE COCKPIT.

