note: >
  Né de l'arbitrage gardien du 06/08/2026 (S50), gravé à modele-donnees v1.32 §5.7 (PR #306,
  mergée) : le budget reste une SOURCE RÉSERVÉE (deux personnes) tandis que la DONNÉE s'affiche à
  toute la firme au cockpit, par projection dérivée — patron des gabarits ERP (§5.1). Ce chantier
  porte la projection ; T-0051 porte le bandeau qui la lit.

  POURQUOI CE DÉCOUPAGE : projection et bandeau vivent sur deux chemins sensibles distincts
  (outils/mcp-graph/ et outils/tour-de-controle-spfx/) et sortent par deux runbooks de
  déploiement différents (image Azure ; paquet .sppkg à l'App Catalog). Les mêler produirait une
  PR à cheval, impossible à éprouver par morceaux.

  ÉTAT DU DROIT — MESURÉ, et contraire à ce que le contrat a longtemps dit : l'identité managée
  id-allia-mcp-graph porte Sites.Selected role=WRITE sur Contrats-et-administratif depuis T-0031
  (architecture.md, registre des octrois), corroboré par l'usage (gabarits ERP créés et régénérés
  sur ce site depuis le 17/07 ; inscrire_cout_structure y écrit depuis le 01/08). AUCUN octroi
  nouveau n'est requis, ni côté source ni côté destination (write aussi sur AlliaConsuling,
  T-0002a-bis). Corollaire à ne pas euphémiser : l'invariant « la machine n'écrit jamais le
  budget » n'est PAS garanti par le droit — il l'est par le CODE (primitives à cible figée). Le
  dernier critère d'acceptation ci-dessus est donc une GARDE, pas une formalité.

  POINT NON ACQUIS, première épreuve du chantier : les permissions uniques posées sur le dossier
  le 06/08 peuvent bloquer un jeton app-only malgré Sites.Selected. À MESURER, jamais à déduire.

  SUR LE CRAN : le champ cran porte une valeur du vocabulaire contrôlé — valide. Elle qualifie
  l'EFFET AU TENANT : rendre le budget de la firme (CA, EBITDA) lisible par tout collaborateur
  est un élargissement d'audience à rayon firme entière, porte du gardien. Ce qui n'est PAS le
  cran du chantier : le cran de l'OUTIL projeter_budget sera auto (écriture d'un DÉRIVÉ à cible
  figée, réversible, interne, local — patron reconcilier_gabarit_pilotage), à graver en
  table-des-crans ; l'édition du code en branche est un cran auto, le moyen et non l'effet ; la
  création de la liste au tenant est un RUNBOOK GARDIEN ; la porte de merge du chemin sensible
  est un mécanisme de la CI.
