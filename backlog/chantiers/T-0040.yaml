  --- REQUALIFICATION du 05/08/2026 (S49), par arbitrage gardien ---
  CONSTAT D'USAGE du 05/08/2026, mesuré au tenant : la Liste « Missions » ne portait que DEUX
  lignes (Projet Siteflow CM 1, Projet Datalab CM 2). La mission 4 — opportunité O-003
  « Cockpit M365 », Gagnée depuis le 24/07 à 10:05:40, CodeMission = 4 alloué par la machine
  (allouer_code_mission, T-0038) à 10:09:10 — n'y avait JAMAIS eu de ligne. D'où « Missions
  actives : 2 » au cockpit : kpi-organisation.ts::compterMissionsActives compte la Liste
  « Missions » au statut « En cours », PAS le CRM. Une mission vivante au CRM et à l'économique
  était donc invisible du registre. Rattrapage joué le 05/08 sous identité déléguée du gardien
  (ligne id 4 : Projet Cockpit M365 | 4 | Arabelle Solutions | En cours | 2026-07-01 →
  2026-12-31) ; contrôle après : « Missions actives : 3 », bandeau 4 BYTE-IDENTIQUE (CA cumul
  55 054 €, EBITDA budget total 105 389 €, EBITDA réalisé 50 101 €). Normalisations jouées dans
  la foulée : Responsable posé sur O-003 (était vide), casse « Arabelle solutions » →
  « Arabelle Solutions » sur Missions id 1.

  ARBITRAGE GARDIEN du 05/08/2026 : « Dès que la ligne CRM passe en Gagnée, la machine crée la
  ligne mission. Je dépose ensuite l'Excel à mon rythme, en me basant sur le numéro attribué. »
  Le chantier change donc d'OBJET : il ne s'agit plus d'outiller le classeur de saisie, mais
  d'ouvrir l'OSSATURE de la mission (CodeMission + ligne Liste « Missions » + espace). Le
  classeur de saisie SORT du périmètre : il redevient un DÉPÔT HUMAIN, au rythme du gardien,
  nommé d'après le CodeMission alloué — l'invariant « la machine n'écrit jamais la saisie » en
  sort RENFORCÉ, pas contourné.

  RETRAIT DE DÉPENDANCE (05/08/2026) : T-0042 est retiré de depend_de. L'initialisation outillée
  du classeur de saisie sort du CHEMIN CRITIQUE de l'ouverture de mission, puisque le dépôt
  redevient humain. Ce retrait ne requalifie PAS T-0042 lui-même, qui reste ce qu'il est et
  suit sa propre trajectoire.

