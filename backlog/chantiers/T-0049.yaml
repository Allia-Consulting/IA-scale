note: >
  Né de la vague de conception du 03/08/2026, gravé par tour-de-controle.md v2.3 §3.2 (mergée).
  SÉQUENCE — le correctif du Title O-NNN du geste « nouvelle opportunité » (plan.md §13.2, reste
  d'hygiène CRM nommé le 24/07, non ouvert) doit être joué AVANT ce chantier, en PR SPFx dédiée :
  même surface, même geste, et surtout même classe de défaut. Ouvrir la création de COMPTE sur un
  geste qui ne pose pas correctement l'identifiant stable des OPPORTUNITÉS, c'est dupliquer le
  défaut sur une seconde liste au lieu de le refermer. Le correctif n'est pas un chantier distinct :
  c'est le premier commit de celui-ci, ou une micro-PR qui le précède.
  Le statut initial « Prospect » du compte créé est le choix par défaut de l'arbitrage du 03/08 ; il
  est À CONFIRMER au premier usage réel (v2.3 §3.2 le dit ainsi). S'il s'avère faux à l'usage, c'est
  une correction d'une valeur, pas une reconception.
  Hygiène connexe NOMMÉE, NON OUVERTE ici (plan.md §13) : promotion tracée Zone-de-proposition ->
  CRM, et clics gardien d'hygiène tenant.
