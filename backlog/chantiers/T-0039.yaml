id: T-0039
titre: "Gestes recrutement du cockpit — ajout candidat, changement d'étape en ligne, cascade « Acceptée » sur confirmation"
capacite: "Généralisation ; cockpit utilisateur (Phase 4) / T-0035 point 4 — pipe recrutement"
phase: 4
type_action: infrastructure
cran: "gestes = éditions humaines directes sous identité Entra de l'utilisateur (hors régime des crans — tour-de-controle.md §6) ; cascade « Acceptée » = cascade déterministe (annonce exhaustive + confirmation explicite obligatoires, §1 régime 2) ; la PR touche outils/tour-de-controle-spfx/** → porte humaine, pas d'auto-merge"
produit:
  - "(geste « ajouter un candidat ») formulaire minimal du bandeau Recrutement : NomCandidat, Grade, Source, Email, Telephone (optionnel) ; création dans la Liste « Candidats » via SharePoint REST sous identité utilisateur ; Etape posée à E1 ; Title alloué au motif C-NNN (max des ^C-(\\d+)$ existants + 1) — le défaut Title du geste CRM (plan §13.2) n'est PAS reproduit"
  - "(geste « changement d'étape en ligne ») liste déroulante Etape par ligne candidat (E1/E2/E3/Proposition/Acceptée/Refusée), MERGE SharePoint REST — motif changerEtapeOpportunite ; la bascule vers « Acceptée » ne s'écrit JAMAIS directement : elle ouvre la cascade"
  - "(cascade « Acceptée ») annonce EXHAUSTIVE des trois écritures puis confirmation explicite : (1) Candidats.Etape → Acceptée ; (2) création fiche Ressources-Profil (Prenom, Nom, IdentifiantEntra saisi, Grade repris du candidat, Disponibilité) — minimisation RGPD : Email/Telephone candidat ne migrent PAS ; (3) affectation initiale = ligne d'affectation {CodeMission choisi, Ressource=IdentifiantEntra, Mois, JoursPrevus} dans le classeur de saisie de la mission (Graph Workbook, Files.ReadWrite.All déjà accordé). Annulation = zéro écriture ; échec en cours = arrêt affiché, jamais de réparation silencieuse"
  - "(tests) unités sur payloads, allocation C-NNN, garde de transition Acceptée ; build et CI 4 checks verts"
  - "(amendement volet B, 26/07/2026 S43 — cockpit 1.5.1.0) l'annonce exhaustive de la cascade « Acceptée » passe de TROIS écritures à DEUX écritures + un RAPPEL d'affectation : écritures = (1) Candidats.Etape → Acceptée et (2) création fiche Ressources-Profil ; la 3e écriture (ligne d'affectation Graph Workbook dans T_Affectations) est RETIRÉE. À la place, un rappel — non-écriture — nomme le classeur de saisie `saisie-<code>-….xlsx` (nom réel résolu en lecture seule, motif générique sinon, fail-open) et renvoie l'affectation initiale à sa saisie humaine (modele-donnees.md §5.6). Annulation = zéro écriture, fail-closed d'écriture inchangé. Voir arbitrage daté 26/07 ci-dessous"
arbitrages:
  - "Cascade portée par le cockpit (décision gardien 24/07/2026, S42) : écritures sous identité utilisateur — SharePoint REST pour les listes, Graph Workbook pour l'affectation ; server.py NON touché, aucun scope nouveau (manifeste v1.4.7.0 suffisant, prouvé)"
  - "La décision de recrutement reste humaine (rgpd-recrutement-candidats.md §1) : le geste ne fait qu'exécuter la décision, sur confirmation"
  - "Réduction de scope du volet B (arbitrage gardien 26/07/2026, S43 ; contrat tour-de-controle.md v2.2, PR #262, main db46cb46) : la cascade « Acceptée » n'écrit PLUS l'affectation initiale. Motif : la saisie réelle est MATRICIELLE et la table T_Affectations n'existe que dans les gabarits dérivés (modele-donnees.md §5.2), pas dans la couche de saisie ; le pré-vol fail-closed du 24/07 l'avait prouvé (2 refus, zéro écriture). L'écriture Graph Workbook d'affectation (et son pré-vol) est retirée du code ; l'affectation reste un geste humain dans la saisie, la cascade la RAPPELLE seulement. Cet arbitrage SUPERSÈDE le volet « Graph Workbook pour l'affectation » de la décision datée du 24/07 ci-dessus (entrée conservée telle quelle — historique immuable)"
