note: >
  Né de la vague de conception du 03/08/2026, gravé par tour-de-controle.md v2.3 (§1, §3.1) et
  modele-donnees.md v1.30 (§2 bis, §2 ter) — les deux mergées.
  Point de doctrine à ne pas éroder : ce chantier ÉTEND le périmètre « listes » du régime « Agir »
  (v2.3 §1) d'exactement UNE colonne. Ce n'est pas une brèche dans « le cockpit est en lecture seule
  sur l'économique » : le CodeCouleur n'est PAS une donnée économique — c'est un jugement humain
  qualitatif, sans règle de calcul, qui ne nourrit aucun agrégat, aucune marge, aucun EBITDA. S'il
  devait un jour être calculé, dérivé ou agrégé, il changerait de nature et exigerait un nouveau
  passage par la boucle de promotion.
  La page Détails est en LECTURE sur les taux : elle ne recalcule rien, elle réutilise la surface de
  calcul des barres. Deux calculs = deux vérités ; l'égalité doit tenir par construction, pas par
  vigilance.
