note: >
  Né de la vague de conception du 03/08/2026, gravé par tour-de-controle.md v2.3 §3.4 et
  modele-donnees.md v1.30 §5.7 — les deux mergées.
  ÉTAT DU RÉEL AU NOMMAGE (mesuré sous identité DÉLÉGUÉE le 04/08/2026, lecture directe du classeur
  par son itemId — pas un index de recherche) : le classeur EST DÉPOSÉ et PEUPLÉ. Nom réel
  budgetentreprise.xlsx (SANS tiret), site AlliaConsulting-Contratsetadministratif, dossier
  « 09 - Budget Allia ». Deux onglets (Lisez-moi, Budget) ; T_Budget porte 36 lignes, une par mois,
  de 2026-01 à 2028-12 ; EBITDA_Budget est bien une FORMULE, jamais saisi ; la part variable est
  INCLUSE dans MasseSalariale_Budget au prorata mensuel (contrôle de relecture : janv-2027 -> MS
  97 987 EUR, EBITDA 23 108 EUR). Les premiers mois de 2026 sont VIDES — la convention du mois vide
  joue déjà sur le réel, ce n'est pas un défaut à corriger mais un cas à afficher « · ».
  Le SEUL prérequis bloquant restant est donc l'OCTROI DE LECTURE du dossier, pas le dépôt.
  DEUX PIÈGES À NE PAS REJOUER, consignés à modele-donnees v1.30 §5.7 :
  (1) le serveur Workbook (identité MACHINE) NE VOIT PAS ce site — Sites.Selected n'y est pas
  octroyé, et aucun octroi machine n'est requis puisque le cockpit lit sous identité utilisateur.
  Ne JAMAIS conclure l'absence de ce classeur depuis le serveur Workbook.
  (2) l'absence du classeur a été conclue à tort le 03/08 depuis un INDEX DE RECHERCHE filtré, lu
  comme s'il était un listing de répertoire. Un index n'est pas une mesure : lire l'objet.
  ÉCART DE POINTEUR OUVERT : tour-de-controle.md v2.3 (promu) écrit « budget-entreprise.xlsx » AVEC
  tiret ; le nom réel au tenant fait foi. Correction de pointeur à porter en micro-PR dédiée d'une
  ligne à la prochaine ouverture de tour-de-controle.md — ce chantier CODE contre le nom réel.

  SUR LE CRAN — bloc AJOUTÉ le 05/08/2026 ; rien de ce qui précède n'est réécrit. Le champ cran
  ci-dessus porte désormais la valeur du vocabulaire contrôlé (auto | notifie | valide |
  anonymisation) : valide. Elle qualifie l'EFFET DU CHANTIER AU TENANT — « promouvoir une évolution
  du cockpit » est un cran VALIDÉ, porte du gardien, rayon d'impact firme entière
  (tour-de-controle.md §6), ce que corrobore rayon_impact: firme ci-dessus. La LECTURE SEULE
  n'abaisse PAS ce cran : le chantier rend le BUDGET DE LA FIRME (CA, EBITDA) lisible par tout
  collaborateur, ce qui est un élargissement d'audience à rayon firme entière — et l'octroi de
  lecture du dossier « 09 - Budget Allia » qui le permet est un RUNBOOK GARDIEN (modifier des
  droits est proscrit à l'agent, table-des-crans.yaml). Ce qui n'est PAS le cran du chantier, et que
  la prose antérieure mêlait : l'édition du code en branche est un cran auto
  (editer_fichier_en_branche), le moyen et non l'effet ; la porte de merge du chemin sensible est un
  mécanisme de la CI, pas un cran. L'absence d'écriture reste un INVARIANT du chantier, éprouvé par
  l'eTag (critère ci-dessus) — elle est une garde, pas une justification de cran.
  Prose antérieure du champ, reportée ici sans perte : « édition du code de la web part en branche
  = cran auto ; LECTURE SEULE de bout en bout — aucune écriture, le budget est une saisie humaine
  que la machine ne touche jamais (modele-donnees.md v1.30 §5.7) ; PR sur chemin sensible -> porte
  humaine ; octroi de lecture du dossier au tenant = runbook gardien ».
