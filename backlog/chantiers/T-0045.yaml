note: >
  Nommé en session S45 (01/08/2026) par l'épreuve 3g VERTE (T-0030/T-0035 point 5 —
  docs/epreuves/2026-08-01-t0030-t0035-epreuve-3g-verte.md). CAUSE RACINE : aucune surface
  ne lit aujourd'hui les classeurs de SAISIE avec la position de cellule exacte. Trois voies
  fermées, mesurées à l'épreuve : (a) workbook_lire_table (identité managée) rend 403 sur
  GRAPH_SAISIE_DRIVE_ID (l'API Workbook n'est pas ouverte à l'app sur ce drive) ; (b) le token
  DÉLÉGUÉ rend accessDenied ; (c) le connecteur M365 (surface humaine) APLATIT la grille
  (ressource × mois), perdant les positions. CONSÉQUENCE : T_Imputations (le Réalisé, étape 4
  de la séquence du skill consolidation-pilotage §5) n'est pas dérivable fidèlement — à l'épreuve,
  2 lignes / 39 j dérivés contre 61 j au total réel de la saisie-1, écart de 22 j NOMMÉ, positions
  déduites par recoupement, AUCUN mois forgé (fail-closed honnête). Le Réalisé reste donc le
  maillon manquant de la chaîne économique, alors que le Prévu (T_Affectations) et l'Échéancier
  (T_Echeancier, T-0030 soldé) sont vivants. À INSTRUIRE AVEC : la dette Workbook de
  outils/mcp-graph/server.py (droits de lecture sur le drive de saisie, au moindre privilège —
  jamais d'écriture sur la saisie, §5.6) et le rituel/temps (T-0032, référentiel & réalisé).
  À Y ADOSSER (nommé, non construit) : la MODÉLISATION DES FRAIS REFACTURÉS EN SAISIE — les
  frais refacturés (ex. frais Siteflow mai-juin, entrée directe F-2026-0005 au registre lors de
  l'épreuve 3g) n'ont aujourd'hui aucune ligne d'échéancier source dans la saisie ; leur place
  dans la couche de saisie reste à définir pour que leur facturation passe par la boucle plutôt
  que par une entrée directe sur go gardien. NOMMAGE SEUL, aucun code ; non ouvert.
note_acces_et_fidelite_01_08_2026: >
  FAIT NOUVEAU du 01/08/2026 (la note ci-dessus reste l'HISTORIQUE tel qu'écrit à l'ouverture,
  y compris sa description des trois voies fermées — on ne réécrit pas un relevé). Les voies
  (a) et (b) sont ROUVERTES par l'octroi Sites.Selected role=read sur le seul site Management
  et Gestion : le 403 venait d'une ABSENCE D'OCTROI, PAS d'une limite de l'API Workbook — fait
  mesuré, read SUFFIT en app-only, contrairement à ce que laisse penser la table de permissions
  de la doc Graph (« Application : Not supported »). Le 404 initial, lui, venait du NOM DE TABLE :
  T_Imputations est la table du GABARIT (modele-donnees §5.2), pas de la saisie — la saisie porte
  SAISIE_Prevu_2026, SAISIE_Realise_2026 et SAISIE_Facturation (millésime dans le nom).
  L'ÉCART 22 j DE L'ÉPREUVE 3g EST EXPLIQUÉ : les 22 jours manquants étaient JUILLET, mesuré à
  sa POSITION dans la grille des 14 colonnes [Ressource, Janvier..Décembre, TOTAL] — rien n'était
  perdu, seule la lecture positionnelle manquait. Consigné au canon en candidat modele-donnees
  v1.28 (§5.6 : trois tables nommées, schéma de ligne à 14 colonnes lu PAR POSITION, règle de
  dérivation du Réalisé avec contrôle Σ douze positions == TOTAL et anomalie signalée, accès read
  au moindre privilège avec interdiction de tout scope Files.*).
  RESTE À CONSTRUIRE (ce chantier demeure à_faire) : (1) le DÉRIVATEUR T_Imputations depuis
  SAISIE_Realise_2026 (application de la règle §5.6 consignée) ; (2) la REMONTÉE DU CORPS
  D'ERREUR GRAPH par la primitive workbook_lire_table — aujourd'hui AVALÉ par raise_for_status,
  ce qui a coûté le temps de diagnostic entre 403-sans-octroi et 404-mauvais-nom ; (3) la
  variable d'environnement GRAPH_SAISIE_DRIVE_ID, ABSENTE du conteneur déployé ; (4) la dette
  Workbook de outils/mcp-graph/server.py.
  ANOMALIE À INSTRUIRE (nommée, non résolue) : DIVERGENCE entre le relevé du 14/07/2026
  (juillet 23 j / août 7 j) et la lecture du 01/08/2026 (juillet 22 j / août 10 j) sur la même
  saisie — le TOTAL est IDENTIQUE (148 j). Deux hypothèses non tranchées : saisie humaine
  révisée entre les deux dates, ou relevé du 14/07 imprécis. À instruire, jamais à trancher
  par recoupement.
note_epreuves_vertes_01_08_2026: >
  FAIT NOUVEAU du 01/08/2026, postérieur aux deux notes ci-dessus, qui restent l'HISTORIQUE tel
  qu'écrit (on ne réécrit pas un relevé). Journal : docs/epreuves/2026-08-01-t0045-acces-et-lecture-saisie.md.
  DEUX ÉPREUVES VERTES — l'ACCÈS et la LECTURE de la couche de saisie sont SOLDÉS.
  Épreuve 1/2 (accès) : octroi gardien Sites.Selected role=READ sur le seul site Management et
  Gestion ; la lecture app-only FONCTIONNE sous read seul, CONTRE la doc Learn qui annonce
  « Application : Not supported » sur l'endpoint même que nous appelons (table-list-rows). La preuve
  d'ouverture de la porte est un 404 (et non un 403) sur un nom de table erroné : Graph résout
  l'autorisation AVANT la ressource. Conséquence doctrinale : l'invariant §5.6 « la machine n'écrit
  JAMAIS la saisie » est garanti AU NIVEAU DU DROIT, plus seulement par le code — ne JAMAIS ajouter
  de scope Files.* à l'identité managée.
  Épreuve 2/2 (lecture bornée, image 0.22.0 / révision --0000032) : lire_saisie_table VERTE sur les
  quatre étapes — résolution du classeur par la convention ^saisie-(\d+)- SANS aucun chemin fourni,
  positions préservées (vides rendus tels quels), contrôle Σ douze positions == TOTAL vert sur les
  deux grilles, eTag d'item exposé ; refus PRÉ-RÉSEAU nommant la cause sur T_Imputations (le fait du
  jour rejoué en garde) ; refus explicite sur code_mission inconnu ; 404 Graph remonté AVEC code
  (« ItemNotFound ») et message mot pour mot.
  LES QUATRE CAUSES DU BLOCAGE SONT LEVÉES : absence d'octroi, mauvais nom de table, corps d'erreur
  avalé (points (2) de la note précédente — ACQUIS 0.22.0) et GRAPH_SAISIE_DRIVE_ID absente du
  conteneur (point (3) — variables posées par le gardien).
  ARBITRAGE GARDIEN DU 01/08, tracé comme DÉCISION et NON comme dette : le millésime n'est PAS gaté
  côté serveur (le motif SAISIE_Realise_<millésime> suffit) — une liste blanche exigerait une
  maintenance annuelle et CASSERAIT EN JANVIER ; un 404 lisible est préférable à une garde qui
  périme. Ne pas la « corriger » par réflexe.
  RESTE — ET CE CHANTIER DEMEURE à_faire : le DÉRIVATEUR du Réalisé (T_Imputations depuis
  SAISIE_Realise_2026, application de la règle §5.6 déjà consignée) côté CONSOMMATEUR, et SON
  ÉPREUVE. C'est la DERNIÈRE CONDITION DE SOLDE du chantier : la lecture est acquise, la dérivation
  n'est pas construite. PIÈGE À TENIR POUR CE DÉRIVATEUR (mesuré) : la table rend 21 lignes dont
  l'en-tête technique « Nb. jours ouvres max » (plafond de calendrier, pas une ressource) et 19
  lignes de zone pré-dimensionnée à TOTAL=0 — soit 20 lignes à écarter pour 1 ligne de sens ; la
  primitive les rend VOLONTAIREMENT (lire n'est pas interpréter), le filtrage appartient au
  consommateur. Restent aussi ouverts, inchangés : la modélisation des FRAIS REFACTURÉS en saisie
  (note d'ouverture), la dette Workbook de server.py (point (4)) et l'ANOMALIE de divergence du
  relevé 14/07 vs 01/08 (note précédente), toutes trois non résolues.
note_solde_derivation_realise_01_08_2026: >
  SOLDÉ le 01/08/2026 par la TROISIÈME épreuve du jour — le DÉRIVATEUR du Réalisé, VERTE
  (docs/epreuves/2026-08-01-t0045-derivation-realise-verte.md). Les notes ci-dessus restent
  l'HISTORIQUE tel qu'écrit — on ne réécrit pas un relevé, on ne requalifie pas un soldé.
  CHAÎNE À L'ÉPREUVE : main cd9e314 (PR #289), skill consolidation-pilotage v1.6, image serveur
  0.22.0 révision --0000032, GRAPH_SAISIE_DRIVE_ID / GRAPH_SAISIE_FOLDER_ID posées.
  MESURE : mission 1, SAISIE_Realise_2026 lue par lire_saisie_table (21 lignes × 14 colonnes,
  positions et vides préservés) ; 1 entête technique « Nb. jours ouvres max » et 19 lignes
  fantômes (TOTAL=0) écartées ; ligne retenue lue PAR POSITION — position 5 Mai 17, position 6
  Juin 22, position 7 Juillet 22, position 8 Août VIDE. Contrôles §4 ter : Σ douze positions ==
  TOTAL (61 == 61) ET miroir mission (61 == 61), zéro anomalie. Régénération réconciliée :
  archive gabarit-1-20260801T171502Z.xlsx (déplacement, nom libéré) → ré-instanciation (preuve
  FROIDE verte, lignes_vides:1 ×3, nouvel item 01BWFCBZDZMDH26VHVXJCIB66N5MVYEYES) →
  repeuplement 8/3/8. PREUVES relues À FROID : T_Imputations 3 lignes, Σ JoursRealises = 61
  (baseline 39 → +22 j = JUILLET, l'écart de 3g est comblé), les trois mois portent leurs valeurs
  exactes, AUCUN MOIS FORGÉ (Août vide en saisie reste ABSENT du gabarit) ; non-régression
  T_Affectations Σ 148 j et T_Echeancier Σ 133 200 € HT avec F-2026-001/002/003 reportés SANS
  réallocation (aucun cran validé sollicité). ETag après écriture
  "{AFCF6079-F554-44BA-80FB-CDEB2B826092},9" (17:15:48Z) — NB : une régénération produit un
  fichier NEUF, le GUID change par construction, un ETag ne traverse pas une régénération.
  CRITÈRES : (1) lecture machine à la position exacte sous identité au moindre privilège = TENU
  par mesure ; (2) T_Imputations dérivable fidèlement, Σ = total, sans écart ni mois forgé =
  TENU par mesure ; (3) aucun mois forgé ni déduit, anomalie signalée = TENU PAR CONSTRUCTION
  (skill §4 ter) ET PAR LA CI (golden controle-somme-21 / jamais-mois-forge-22, rouge-puis-vert),
  MAIS NON EXERCÉ sur le tenant — aucun écart réel ne s'est présenté, et on ne fabrique pas un
  faux écart dans une source pour se prouver qu'on le détecte. Solde prononcé sur cet arbitrage,
  dit explicitement.
  NON CLOS PAR CE CHANTIER, reporté et nommé : (a) le contrôle §6 « ressource en saisie absente
  de T_Ressources » n'a PAS pu être clos — le référentiel de coûts est à audience restreinte
  (§5.3) et n'est atteignable par aucune surface de l'agent ; à vérifier par le gardien, car si
  adrien.raque@allia-consulting.com n'y porte pas de CoutJour le cockpit MASQUERA l'EBITDA de
  juillet (acquis T-0043) ; (b) l'ORCHESTRATION lun-ven 05h/13h Paris (§5.6) reste NON CONSTRUITE
  — la dérivation demeure un déclenchement manuel du gardien, ce qui tient aussi la porte du cran
  validé de allouer_num_facture (skill §7) ; (c) la DETTE WORKBOOK de server.py (sessions
  persistantes, $batch) = chantier 0.23.0 nommé, non ouvert ; (d) l'ANOMALIE de divergence du
  relevé du 14/07 (juil 23 / août 7) vs les lectures du 01/08 (juil 22 / août 10), TOTAL 148
  identique, reste OUVERTE et NON TRANCHÉE : la saisie porte lastModifiedDateTime 2026-07-31,
  postérieur au relevé du 14/07, ce qui ORIENTE vers « saisie révisée » sans le prouver (en
  co-édition l'horodatage est différé, le contenu fait foi — §5.6) ; jamais à trancher par
  recoupement ; (e) la MODÉLISATION DES FRAIS REFACTURÉS en saisie (note d'ouverture) reste
  ouverte, inchangée.
