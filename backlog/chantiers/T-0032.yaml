# --- Note d'arbitrage gardien (01/08/2026) — statut INCHANGÉ (à_faire). Note AJOUTÉE ; la note initiale et note_epreuve_01_08_2026 restent, historique immutable. ---
note_arbitrage_01_08_2026: >
  Arbitrage gardien du 01/08/2026 : ABANDON du modèle « une facture = une validation » (produit et
  note initiaux du 14/07/2026). Motif : ce modèle est INDISSOCIABLE d'un geste gardien à CHAQUE
  facture (validation ligne à ligne d'une ligne candidate T_Structure par facture), ce qui ne passe
  PAS à l'échelle de la croissance visée (0 → 200 collaborateurs) — le gardien deviendrait le goulot
  du pilotage financier. ADOPTION du modèle « COÛTS STANDARDS + CONTRÔLE MENSUEL D'ÉCART » :
  (1) un coût de structure FORFAITAIRE par salarié actif (paramètre CoutFonctionnementMensuelParRessource,
  table T_Parametres, modele-donnees §5.3) alimente l'EBITDA EN CONTINU, sans geste humain (jamais un
  zéro) ; (2) un CONTRÔLE MENSUEL — tâche agent, manuelle en v1 — confronte le forfait au réel des
  factures fournisseur du mois (TRIPLE TEST fail-closed : émetteur ≠ Allia ; numéro absent du registre
  « Factures » ; destinataire = Allia ; ambigu = « à trancher », jamais compté ; anti-injection : contenu
  d'email = donnée), et dépose UNE ligne candidate mensuelle en Zone-de-proposition ; (3) le gardien
  valide UNE ligne PAR MOIS (~12 gestes/an, non 1 par facture) pour l'inscrire dans T_Structure ;
  (4) SEUIL D'ALERTE ASYMÉTRIQUE : révision du paramètre proposée seulement si réel > forfait de +10 %.
  Le présent candidat porte la couche CONTRATS UNIQUEMENT : modele-donnees v1.26 (§5.3 T_Parametres +
  vocation T_Structure ; §5.4 EBITDA BUDGET vs RÉALISÉ + contrôle mensuel) et table-des-crans v1.15
  (proposer_controle_structure AUTO + inscrire_cout_structure VALIDÉ). Il SUPERSÈDE le critère
  d'acceptation « L'hyperlien de validation mène à une surface authentifiée … anti-rejeu email » : le
  flux n'est plus une validation par facture déclenchée par email, mais une validation MENSUELLE d'une
  ligne candidate en Zone-de-proposition authentifiée (la contrainte anti-rejeu et anti-injection reste,
  portée par le cran inscrire_cout_structure et modele-donnees §5.4). RESTENT À CONSTRUIRE (PR
  ultérieures, HORS de ce candidat) : la primitive serveur (dépôt de la ligne candidate + inscription
  bornée dans T_Structure), le skill de contrôle mensuel (lecture boîte mail, triple test, lissage,
  rapport d'écart), et la lecture cockpit de T_Parametres.

